name: Build + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Check no Qt in core
      run: ./scripts/check_no_qt_in_core.sh

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev libqt6widgets6 qt6-base-dev-tools \
          cmake ninja-build ccache libcurl4-openssl-dev libsqlite3-dev libsodium-dev libssl-dev

    - name: ccache cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('src/**', 'tests/**', 'CMakeLists.txt', 'cmake/**', 'CMakePresets.json', 'third_party/patches/**') }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: FetchContent + sqlite cache
      uses: actions/cache@v4
      with:
        path: |
          build/_deps
          build/sqlite3.zip
          build/sqlite-amalgamation-3450200
        key: deps-${{ runner.os }}-${{ hashFiles('cmake/**', 'CMakeLists.txt') }}
        restore-keys: |
          deps-${{ runner.os }}-

    - name: Configure
      run: cmake --preset ci

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Test
      run: ctest --test-dir build --output-on-failure
