name: Synapse E2EE Integration

on:
  push:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'tests/test_synapse_e2ee.cpp'
      - 'tests/test_e2ee_*.cpp'
      - 'tests/test_olm_inbound.cpp'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'third_party/**'
      - '.github/workflows/synapse-e2ee.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'tests/test_synapse_e2ee.cpp'
      - 'tests/test_e2ee_*.cpp'
      - 'tests/test_olm_inbound.cpp'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'third_party/**'
      - '.github/workflows/synapse-e2ee.yml'

concurrency:
  group: synapse-e2ee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synapse-e2ee:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Check no Qt in core
      run: ./scripts/check_no_qt_in_core.sh

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev libqt6widgets6 qt6-base-dev-tools \
          cmake ninja-build ccache libcurl4-openssl-dev libsqlite3-dev libsodium-dev

    - name: ccache cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('src/**', 'tests/**', 'CMakeLists.txt', 'cmake/**', 'CMakePresets.json', 'third_party/patches/**') }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: FetchContent + sqlite cache
      uses: actions/cache@v4
      with:
        path: |
          build/_deps
          build/sqlite3.zip
          build/sqlite-amalgamation-3450200
        key: deps-${{ runner.os }}-${{ hashFiles('cmake/**', 'CMakeLists.txt') }}
        restore-keys: |
          deps-${{ runner.os }}-

    - name: Generate Synapse config
      run: |
        mkdir -p synapse-data
        docker run --rm \
          -v "$PWD/synapse-data:/data" \
          -e SYNAPSE_SERVER_NAME=localhost \
          -e SYNAPSE_REPORT_STATS=no \
          matrixdotorg/synapse:latest generate
        # Enable password registration robustly: replace the keys if present,
        # otherwise append them. Runs as root, then ownership is restored so
        # the Synapse container (uid 991) can still read the config.
        sudo python3 -c "
        import re
        p = 'synapse-data/homeserver.yaml'
        s = open(p).read()
        for key in ('enable_registration', 'enable_registration_without_verification'):
            if re.search(r'^' + key + r':.*$', s, re.M):
                s = re.sub(r'^' + key + r':.*$', key + ': true', s, count=1, flags=re.M)
            else:
                s += chr(10) + key + ': true' + chr(10)
        # Raise the registration rate limit (the test registers several users).
        if re.search(r'^rc_registration:.*$', s, re.M):
            s = re.sub(r'^rc_registration:.*$',
                       'rc_registration: {per_second: 100, burst_count: 100}', s, count=1, flags=re.M)
        else:
            s += chr(10) + 'rc_registration: {per_second: 100, burst_count: 100}' + chr(10)
        open(p, 'w').write(s)
        "
        sudo chown 991:991 synapse-data/homeserver.yaml
        echo "--- registration config ---"
        grep -E '^enable_registration' synapse-data/homeserver.yaml || true

    - name: Start Synapse
      run: |
        docker run -d --name synapse \
          -v "$PWD/synapse-data:/data" \
          -p 8008:8008 \
          matrixdotorg/synapse:latest
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8008/_matrix/client/versions >/dev/null; then
            echo "Synapse ready after ${i}s"
            exit 0
          fi
          sleep 1
        done
        docker logs synapse
        echo "Synapse failed to start"
        exit 1

    - name: Configure
      run: cmake --preset ci

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run Synapse E2EE integration test
      run: |
        SYNAPSE_URL=http://localhost:8008 ./build/test_synapse_e2ee
