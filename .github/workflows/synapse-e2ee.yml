name: Synapse E2EE Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  synapse-e2ee:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev libqt6widgets6 qt6-base-dev-tools \
          cmake ninja-build ccache libcurl4-openssl-dev libsqlite3-dev

    - name: Generate Synapse config
      run: |
        mkdir -p synapse-data
        docker run --rm \
          -v "$PWD/synapse-data:/data" \
          -e SYNAPSE_SERVER_NAME=localhost \
          -e SYNAPSE_REPORT_STATS=no \
          matrixdotorg/synapse:latest generate
        # Enable password registration IN-PLACE (no duplicate YAML keys) —
        # /data stays owned by uid 991 so the Synapse container can read its
        # signing key. sed -i runs as root via sudo.
        sudo sed -i \
          -e 's/^enable_registration:.*/enable_registration: true/' \
          -e 's/^enable_registration_without_verification:.*/enable_registration_without_verification: true/' \
          synapse-data/homeserver.yaml
        # Fix ownership back to uid 991 (sed -i as root changed it) and
        # verify the settings took effect.
        sudo chown 991:991 synapse-data/homeserver.yaml
        grep -E '^enable_registration' synapse-data/homeserver.yaml

    - name: Start Synapse
      run: |
        docker run -d --name synapse \
          -v "$PWD/synapse-data:/data" \
          -p 8008:8008 \
          matrixdotorg/synapse:latest
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8008/_matrix/client/versions >/dev/null; then
            echo "Synapse ready after ${i}s"
            exit 0
          fi
          sleep 1
        done
        docker logs synapse
        echo "Synapse failed to start"
        exit 1

    - name: Configure
      run: cmake --preset ci

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run Synapse E2EE integration test
      run: |
        SYNAPSE_URL=http://localhost:8008 ./build/test_synapse_e2ee
